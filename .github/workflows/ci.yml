name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Generate synthetic corpus
        run: python data/generate_synthetic_data.py

      - name: Build labeled eval set
        run: python eval/build_eval_set.py

      - name: Run tests
        # No Ollama and no GEMINI_API_KEY are available in this runner, so this
        # exercises the rule-based fallback paths end to end for every LLM-gated code
        # path — exactly what the system is designed to degrade to. See README for
        # what changes with a local model or cloud key available.
        run: pytest -q

      - name: Run eval harness
        run: |
          python eval/run_benchmark.py
          python eval/ablation_study.py
          python eval/latency_comparison.py
          python eval/baseline_comparison.py
          python eval/personalization_lift.py
          python eval/image_content_search.py

      - name: Report eval drift vs. committed results
        if: always()
        run: |
          echo "## Eval results: freshly generated vs. committed" >> "$GITHUB_STEP_SUMMARY"
          if git diff --quiet -- eval/results/; then
            echo "No drift — freshly generated eval/results/ match what's committed." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Drift detected (expected without GEMINI_API_KEY, or after a real code change):" >> "$GITHUB_STEP_SUMMARY"
            echo '```diff' >> "$GITHUB_STEP_SUMMARY"
            git diff --stat -- eval/results/ >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload eval results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/

  cross-platform:
    # Sift is a desktop app as much as a server: prove it installs, passes its tests, and
    # serves the app and the quick-search window on macOS and Windows too (Linux is covered
    # by the jobs above). The evaluation harness only runs on Linux; it is OS-independent.
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/frontend/package-lock.json

      # lightgbm's macOS wheel links against libomp, which the runner doesn't ship.
      - name: Install libomp (macOS)
        if: runner.os == 'macOS'
        run: brew install libomp

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the web app
        working-directory: ui/frontend
        run: |
          npm ci
          npm run build

      - name: Generate synthetic corpus and eval set
        run: |
          python data/generate_synthetic_data.py
          python eval/build_eval_set.py

      - name: Run tests
        run: pytest -q

      - name: The quick-search shortcut's key listener loads
        run: |
          python -m app.launcher --help
          python -c "from pynput import keyboard; from app import launcher; print('hotkey:', launcher._pretty(launcher.HOTKEY))"

      - name: Smoke test — the app, the quick-search window and a search
        run: |
          SIFT_AUTO_INDEX=0 python -m uvicorn app.api:app --host 127.0.0.1 --port 8000 > server.log 2>&1 &
          python - <<'EOF'
          import json, time, urllib.request

          base = "http://127.0.0.1:8000"
          for _ in range(120):
              try:
                  urllib.request.urlopen(f"{base}/api/me", timeout=2)
                  break
              except OSError:
                  time.sleep(2)
          else:
              raise SystemExit("server never came up")

          for path in ("/", "/quick-search"):
              page = urllib.request.urlopen(base + path).read().decode()
              assert '<div id="root">' in page, f"{path} did not serve the web app"
              print("OK", path)

          req = urllib.request.Request(
              f"{base}/api/query", method="POST", headers={"Content-Type": "application/json"},
              data=json.dumps({"query": "open gradient_descent_v2.md", "user_id": 1}).encode(),
          )
          body = json.load(urllib.request.urlopen(req, timeout=300))
          assert body["results"], "search returned nothing"
          print("OK search:", body["routing_trace"]["tier"], "->", body["results"][0]["filename"])
          EOF

      - name: Server log on failure
        if: failure()
        run: cat server.log || true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ui/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check and build
        run: npm run build

  docker:
    # Proves docker-compose.yml actually boots the full stack (ollama + api + frontend)
    # end to end, independent of any local machine — this is the only way this project
    # verifies Docker at all, since local Docker Desktop is unavailable in this build
    # environment. Runs on every push so this never silently rots.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build and start the full stack
        run: docker compose up -d --build

      - name: Wait for the API to become reachable and healthy
        run: |
          echo "Polling http://localhost:8000/api/users (cold boot: ollama model pull +"
          echo "corpus generation + embedding index builds can take several minutes)..."
          deadline=$((SECONDS + 900))
          until curl -sf http://localhost:8000/api/users -o /tmp/users_response.json; do
            if [ $SECONDS -ge $deadline ]; then
              echo "API did not become reachable within 15 minutes."
              echo "--- docker compose ps ---"
              docker compose ps
              echo "--- docker compose logs ---"
              docker compose logs
              exit 1
            fi
            sleep 10
          done
          echo "API responded after ${SECONDS}s."
          cat /tmp/users_response.json

      - name: Smoke test — API returns the seeded users
        run: |
          python3 -c "
          import json
          data = json.load(open('/tmp/users_response.json'))
          names = {u['name'] for u in data}
          seeded = {'Priya Iyer', 'David Chen', 'Maria Santos'}
          assert seeded <= names, f'seeded personas missing: {seeded - names}'
          print('OK — API is serving the seeded corpus; users:', names)
          "

      - name: Smoke test — a real query round-trips end to end
        run: |
          curl -sf -X POST http://localhost:8000/api/query \
            -H 'Content-Type: application/json' \
            -d '{"query": "open gradient_descent_v2.md", "user_id": 1}' \
            -o /tmp/query_response.json
          python3 -c "
          import json
          data = json.load(open('/tmp/query_response.json'))
          assert 'routing_trace' in data and 'results' in data, f'unexpected response shape: {data.keys()}'
          print('OK — routed to tier:', data['routing_trace']['tier'], 'with', len(data['results']), 'results')
          "

      - name: Smoke test — frontend serves the app
        # The frontend container only starts once the api's healthcheck passes, which can
        # lag the first successful /api/users response, so poll instead of a single curl.
        run: |
          for i in $(seq 1 60); do
            if curl -sf http://localhost:5173/ -o /dev/null; then echo "frontend reachable"; exit 0; fi
            sleep 2
          done
          echo "frontend never became reachable"; docker compose ps; exit 1

      - name: Show container status and logs on failure
        if: failure()
        run: |
          docker compose ps
          docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
